[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RPI_workspace"
version = "0.1.0"
description = "Mi librería DIY para proyectos con Raspberry Pi"
readme = "README.md"
authors = [
    { name = "Nicolas Andrade Manrique" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "gpiozero",
    "pigpio"
]